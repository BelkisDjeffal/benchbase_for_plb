# File: playbook_injector_monitor.yml

- name: Run BenchBase experiments
  hosts: localhost
  connection: local
  vars:
    persistent_results_root: "/home/bdjeffal/measurements/V1_dedicated_3_2_kill_P_kill_P"
    workspace_root: "/root/benchbase"
   
    benchbase_runs:
      - { terminals: 300, weights: "150,150" }
      - { terminals: 450, weights: "225,225" }
      - { terminals: 150, weights: "75,75" }
      
      - { terminals: 400, weights: "200,200" }
      - { terminals: 600, weights: "300,300" }
      - { terminals: 200, weights: "100,100" }

      - { terminals: 350, weights: "175,175" }
      - { terminals: 175, weights: "88,87" }
      - { terminals: 525, weights: "263,262" }

    repetitions: 5

    fault_scenarios:

      - name: "killP_90_killP_150_rejoinP1_210_rejoinP2_270"
        fault_events:
          - { at_s: 90, role: "premium_replica1", action: "stop" }
          - { at_s: 150, role: "premium_replica2", action: "stop" }
          - { at_s: 210, role: "premium_replica1", action: "start" }
          - { at_s: 270, role: "premium_replica2", action: "start" }


  tasks:
    - name: Ensure summary extractor is executable
      shell: chmod +x extract_summary_priorities.sh
      args:
        chdir: /root/benchbase/measurements/data

    - name: Run each BenchBase configuration
      loop: "{{ benchbase_runs }}"
      loop_control:
        loop_var: run
      include_tasks: run_benchbase_once_injector_monitor.yml
      vars:
        terminals: "{{ run.terminals }}"
        weights: "{{ run.weights }}"
        # repetitions: "{{ repetitions }}"

    # - name: Read last run path
    #   shell: cat /tmp/last_benchbase_output_dir.txt
    #   register: last_output

    # - name: Extract summary priorities into correct folder

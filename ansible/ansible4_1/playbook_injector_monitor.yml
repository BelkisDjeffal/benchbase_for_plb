# File: playbook_injector_monitor.yml

- name: Run BenchBase experiments
  hosts: localhost
  connection: local
  vars:
    persistent_results_root: "/home/bdjeffal/measurements/V1_dedicated_3_2_no_fault"
    workspace_root: "/root/benchbase"
   
    benchbase_runs:
      - { terminals: 60, weights: "30,30" }
      - { terminals: 120, weights: "60,60" }
      - { terminals: 180, weights: "90,90" }
      - { terminals: 240, weights: "120,120" }
      - { terminals: 360, weights: "180,180" }
      - { terminals: 420, weights: "210,210" }
      - { terminals: 480, weights: "240,240" }
      - { terminals: 540, weights: "270,270" }

    repetitions: 5

    fault_scenarios:
      - name: "no_fault"
        fault_events: []


  tasks:
    - name: Ensure summary extractor is executable
      shell: chmod +x extract_summary_priorities.sh
      args:
        chdir: /root/benchbase/measurements/data

    - name: Run each BenchBase configuration
      loop: "{{ benchbase_runs }}"
      loop_control:
        loop_var: run
      include_tasks: run_benchbase_once_injector_monitor.yml
      vars:
        terminals: "{{ run.terminals }}"
        weights: "{{ run.weights }}"
        # repetitions: "{{ repetitions }}"


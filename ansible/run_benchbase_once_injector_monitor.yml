#run_benchbase_once_injector_monitor
- name: Get timestamp as a fact
  vars:
    ts: "{{ lookup('pipe', 'date +%Y%m%d_%H%M%S') }}"
  set_fact:
    run_label: "runs_outputs_{{ ts }}"
    benchbase_output_dir: "/home/benchbase/measurements/data/runs_outputs_{{ ts }}"   

- name: Create output folder
  file:
    path: "{{ benchbase_output_dir }}"
    state: directory

- name: Generate customized XML config
  template:
    src: /home/benchbase/templates/sample_tpch_config.xml.j2
    dest: /home/benchbase/target/benchbase-postgres/config/postgres/sample_tpch_config.xml
    backup: yes

- name: Loop over repeated runs
  loop: [1, 2]
  loop_control:
    loop_var: run_id
  shell: >
    ansible-playbook -i /home/benchbase/ansible/inventory_monitor.yml
    /home/benchbase/ansible/run_one_iteration.yml
    --extra-vars "run_id={{ run_id }} run_label={{ run_label }} benchbase_output_dir={{ benchbase_output_dir }}"
  register: play_output
  ignore_errors: yes

- name: Show output of sub-playbook
  debug:
    var: play_output.stdout_lines

- name: Show error output if failed
  when: play_output.rc != 0
  debug:
    var: play_output.stderr_lines

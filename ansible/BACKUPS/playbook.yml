- name: Initialize grid 5000
  hosts: grid5000
  remote_user: bdjeffal
  vars:
    OS_image: ubuntu2204-x64-min
  tasks:
    - name: Go to the frontend of {{ grid_site }} then create a job
      command: "oarsub -p \"host IN ({{ grid_hosts | join(',') }})\" -l host=6,walltime={{ grid_time }} -r 'now' -t deploy"
      register: job_output

    - name: Extract job ID
      set_fact:
        job_id: "{{ job_output.stdout | regex_search('OAR_JOB_ID=(\\d+)', '\\1') | first }}"

    - name: Log job ID
      debug:
        msg: "Job ID: {{ job_id }}"

    - name: Wait for reservation validation
      pause:
        minutes: 4

    - name: Get job details
      command: "oarstat -f -j {{ job_id }}"
      register: job_details

    - name: Extract assigned hostnames
      set_fact:
        reserved_nodes: "{{ (job_details.stdout | regex_search('assigned_hostnames = (.+)', '\\1')) | first | split('+') }}"
    
    - name: Log reserved nodes
      debug:
        msg: "Reserved nodes: {{ reserved_nodes }}"
    
    - name: Assign nodes and update `group_vars/all.yml`
      copy:
        dest: "group_vars/all.yml"
        content: |
          reserved_nodes: {{ reserved_nodes | to_yaml }}
          premium_nodes: {{ reserved_nodes[:2] | to_yaml }}
          freemium_nodes: {{ reserved_nodes[2:] | to_yaml }}
      delegate_to: localhost
      run_once: true

    - name: Add reserved nodes to inventory
      add_host:
        name: "{{ item }}"
        ansible_host: "{{ item }}"
        groups: reserved_nodes
      loop: "{{ reserved_nodes }}"
      
    - name: Deploy OS on all reserved nodes (Start asynchronously)
      command: "kadeploy3 -m {{ item }} -e {{ OS_image }}"
      loop: "{{ reserved_nodes }}"
      async: 300  
      poll: 0      
      register: os_deployment_jobs

    - name: Wait for all OS deployments to complete
      async_status:
        jid: "{{ item.ansible_job_id }}"
      register: os_deployment_results
      until: os_deployment_results.finished
      retries: 30  
      delay: 10
      loop: "{{ os_deployment_jobs.results }}"

- name: Generate updated JDBC configuration
  hosts: localhost
  tags: jdbc_config
  tasks:
    - name: Reload group variables
      include_vars:
        file: group_vars/all.yml

    - name: Debug global variables
      debug:
        msg:
          - "Premium Nodes: {{ premium_nodes }}"
          - "Freemium Nodes: {{ freemium_nodes }}"

    - name: Generate new database properties file
      template:
        src: /home/spirals/phd/experiments/decembre/plb/src/main/resources/replicas-grid5000.properties.j2
        dest: /home/spirals/phd/experiments/decembre/plb/src/main/resources/replicas-grid5000.properties
        backup: yes

- name: Ensure reserved_nodes group exists in inventory
  hosts: localhost
  tasks:
    - name: Reload group variables
      include_vars:
        file: group_vars/all.yml

    - name: Debug loaded variables
      debug:
        msg:
          - "Reserved Nodes: {{ reserved_nodes | default([]) }}"
          - "Premium Nodes: {{ premium_nodes | default([]) }}"
          - "Freemium Nodes: {{ freemium_nodes | default([]) }}"

    - name: Ensure reserved nodes are added to inventory
      add_host:
        name: "{{ item }}"
        ansible_host: "{{ item }}"
        groups: reserved_nodes
      loop: "{{ reserved_nodes }}"
      when: reserved_nodes is defined

- name: Install and configure PostgreSQL
  hosts: reserved_nodes
  remote_user: root
  tasks:
    - name: Install required packages
      apt:
        name:
          - wget
          - ca-certificates
          - postgresql
          - postgresql-contrib
        state: present
        update_cache: yes

    - name: Start and enable PostgreSQL service
      systemd:
        name: postgresql
        state: started
        enabled: yes

    - name: Ensure PostgreSQL is accessible
      command: "pg_isready"
      register: postgres_status
      changed_when: false

    - name: Log PostgreSQL readiness
      debug:
        msg: "PostgreSQL is running on {{ inventory_hostname }}"

    - name: Create PostgreSQL admin user and set password
      ansible.builtin.shell: |
        sudo -i -u postgres psql -c "CREATE USER admin WITH PASSWORD 'password';"
        sudo -i -u postgres psql -c "ALTER USER admin CREATEDB;"
        sudo -i -u postgres psql -c "CREATE DATABASE benchbase OWNER admin;"
      register: pg_creation_status

    - name: Log PostgreSQL admin user creation
      debug:
        msg: "PostgreSQL admin user created and database benchbase assigned to admin."

    - name: Log database creation
      debug:
        msg: "Database creation status: {{ pg_creation_status.stdout_lines }}"

    - name: Install required Python packages for PostgreSQL
      ansible.builtin.package:
        name: python3-psycopg2
        state: present

    - name: Log Python package installation
      debug:
        msg: "Required Python packages for PostgreSQL installed."

    - name: Configure PostgreSQL - listen_addresses
      lineinfile:
        path: /etc/postgresql/14/main/postgresql.conf
        regexp: '^#?listen_addresses'
        line: "listen_addresses = '*'"
      register: pg_conf

    - name: Configure PostgreSQL - pg_hba.conf
      blockinfile:
        path: /etc/postgresql/14/main/pg_hba.conf
        block: |
          host    all    all    0.0.0.0/0    md5
      register: pg_hba

    - name: Restart PostgreSQL
      systemd:
        name: postgresql
        state: restarted
      register: pg_restart

    - name: Allow PostgreSQL through firewall
      ufw:
        rule: allow
        port: 5432
        proto: tcp
      register: ufw_config

- name: Ensure reserved_nodes group exists in inventory 2
  hosts: localhost
  tasks:
    - name: Reload reserved_nodes from group_vars 2
      include_vars:
        file: group_vars/all.yml

    - name: Re-add reserved nodes to inventory 2
      add_host:
        name: "{{ item }}"
        groups: reserved_nodes
      loop: "{{ reserved_nodes }}"

- name: Continue  on postgres servers
  hosts: reserved_nodes
  remote_user: root
  tasks:
    - name: Copy TPCH SQL dump to each reserved node
      copy:
        src: ../tpch.sql
        dest: /tmp/tpch.sql
      tags: tpch_copy

    - name: Restore TPCH database
      ansible.builtin.shell: |
        sudo -i -u postgres psql -d benchbase -f /tmp/tpch.sql
      register: restore_status
      changed_when: "'ERROR' not in restore_status.stderr"

    - name: Log restore status
      debug:
        msg: "TPCH database restored on {{ inventory_hostname }}"


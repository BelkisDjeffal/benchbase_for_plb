- name: Load replica role labels
  include_vars: "{{ playbook_dir }}/group_vars/all4.yml"

- name: Fetch pidstat logs
  fetch:
    src: "/tmp/monitoring/{{ run_label }}/run_{{ run_id }}/pidstat.log"
    dest: "{{ benchbase_output_dir }}/monitoring/run_{{ run_id }}/{{ replica_roles[inventory_hostname] }}_{{ inventory_hostname }}.log"
    flat: yes
  delegate_to: "{{ item }}"
  with_items: "{{ groups['postgres_servers'] }}"

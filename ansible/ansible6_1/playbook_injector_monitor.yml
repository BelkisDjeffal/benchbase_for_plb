# File: playbook_injector_monitor.yml

- name: Run BenchBase experiments
  hosts: localhost
  connection: local
  vars:
    persistent_results_root: "/home/bdjeffal/measurements/B3_pannes_farcnhes"
    workspace_root: "/root/benchbase" 

    benchbase_runs:

      - { terminals: 600, weights: "300,300" }
      - { terminals: 600, weights: "450,150" }
      - { terminals: 600, weights: "150,450" }

    repetitions: 5

    fault_scenarios:
      - name: "killP_120_killP_120_rejoinP1_210_rejoinP2_210"
        fault_events:
          - { at_s: 120, role: "premium_replica1", action: "stop" }
          - { at_s: 120, role: "premium_replica2", action: "stop" }
          - { at_s: 210, role: "premium_replica1", action: "start" }
          - { at_s: 210, role: "premium_replica2", action: "start" }


  tasks:
    - name: Ensure summary extractor is executable
      shell: chmod +x extract_summary_priorities.sh
      args:
        chdir: /root/benchbase/measurements/data

    - name: Run each BenchBase configuration
      loop: "{{ benchbase_runs }}"
      loop_control:
        loop_var: run
      include_tasks: run_benchbase_once_injector_monitor.yml
      vars:
        terminals: "{{ run.terminals }}"
        weights: "{{ run.weights }}"
        # repetitions: "{{ repetitions }}"


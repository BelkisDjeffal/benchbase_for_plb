# playbook_data_setup.yml

- name: Stop PostgreSQL on all replica nodes before sync
  hosts: postgres_servers
  become: yes
  gather_facts: false

  tasks:
    - name: Stop PostgreSQL 14 main service
      systemd:
        name: postgresql@14-main
        state: stopped
      when: inventory_hostname != source_host


- name: Full setup from injector (data load, rsync, benchbase build)
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    source_data_dir: /var/lib/postgresql/14/main
    replica_data_dir: /var/lib/postgresql/14/main

  tasks:

    - name: Load data on first node 
      tags: data_loading
      ansible.builtin.shell: >
        java -jar benchbase.jar -b tpch -c config/postgres/sample_tpch_config.xml
        --create=true --load=true --execute=false
      args:
        chdir: /home/benchbase/target/benchbase-postgres

    - name: Check which host is running this (should be source_host)
      delegate_to: "{{ source_host }}"
      shell: hostname
      register: host_check

    - name: Confirm delegation is working
      debug:
        msg: "Rsync will be executed from: {{ host_check.stdout }}"

    - name: Rsync data dir from first node to all replicas in parallel
      tags: after_data_loading
      delegate_to: "{{ source_host }}"
      remote_user: root
      shell: >
        rsync -az --delete --whole-file
        --exclude=pg_stat --exclude=pg_wal
        -e "ssh -o StrictHostKeyChecking=no"
        {{ source_data_dir }}/
        root@{{ item }}:{{ replica_data_dir }}/
      loop: "{{ groups['postgres_servers'] | difference([source_host]) }}"
      async: 7200
      poll: 0
      register: rsync_jobs

    - name: Wait for all rsync jobs to finish
      tags: wait
      delegate_to: "{{ source_host }}"
      async_status:
        jid: "{{ item.ansible_job_id }}"
      register: rsync_status_result
      until: rsync_status_result.finished
      retries: 100
      delay: 30
      loop: "{{ rsync_jobs.results }}"
      loop_control:
        label: "{{ item.item }}"
        loop_var: item

    - name: Print rsync results
      tags: after_data_loading
      debug:
        msg: "Replica {{ item.item }} rsync finished with status: {{ item.finished }}"
      loop: "{{ rsync_status_result.results }}"

    - name: Build BenchBase after warmup
      tags: after_data_loading
      ansible.builtin.shell: |
        ./mvnw clean package -P postgres -DskipTests && cd ./target && tar xvzf benchbase-postgres.tgz
      args:
        chdir: /home/benchbase
      register: benchbase_build_output

    - name: Ensure run_benchbase.sh is executable
      tags: after_data_loading
      ansible.builtin.shell: chmod +x run_benchbase.sh
      args:
        chdir: /home/benchbase

    - name: Ensure extract_summary_priorities.sh is executable
      tags: after_data_loading
      ansible.builtin.shell: chmod +x extract_summary_priorities.sh
      args:
        chdir: /home/benchbase/measurements/data


- name: Start PostgreSQL on all replica nodes after sync
  hosts: postgres_servers
  become: yes
  gather_facts: false

  tasks:
    - name: Start PostgreSQL 14 main service
      systemd:
        name: postgresql@14-main
        state: started
      when: inventory_hostname != source_host

    - name: Confirm PostgreSQL is ready
      shell: pg_isready
      register: pg_status
      when: inventory_hostname != source_host

    - name: Print readiness
      debug:
        msg: "Replica {{ inventory_hostname }} status: {{ pg_status.stdout }}"
      when: inventory_hostname != source_host

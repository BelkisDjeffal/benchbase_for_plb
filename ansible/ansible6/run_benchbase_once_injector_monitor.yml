# File: run_benchbase_once_injector_monitor.yml

- name: Get timestamp
  vars:
    ts: "{{ lookup('pipe', 'date +%Y%m%d_%H%M%S') }}"
  set_fact:
    ts_run: "{{ ts }}"

- name: Generate customized XML config (for this terminals/weights)
  template:
    src: /home/benchbase/templates/sample_tpch_config.xml.j2
    dest: /home/benchbase/target/benchbase-postgres/config/postgres/sample_tpch_config.xml
    backup: yes

- name: Run all fault scenarios for this (terminals, weights)
  loop: "{{ fault_scenarios }}"
  loop_control:
    loop_var: fs
  block:
    - name: Set run label + output folder
      set_fact:
        run_label: "T{{ terminals }}__W{{ weights | replace(',', '-') }}__{{ fs.name }}__{{ ts_run }}"
        benchbase_output_dir: "/home/benchbase/measurements/data/runs_outputs/monitoring/{{ run_label }}"

    - name: Save output path to file (optional, for manual debugging)
      copy:
        dest: /tmp/last_benchbase_output_dir.txt
        content: "{{ benchbase_output_dir }}"

    - name: Create output folder
      file:
        path: "{{ benchbase_output_dir }}"
        state: directory

    - name: Clear old measured summaries (avoid mixing scenarios)
      shell: rm -f /home/benchbase/target/benchbase-postgres/results/*.summary.json
      ignore_errors: yes

    - name: Run repetitions via sub-playbook
      loop: "{{ range(1, repetitions + 1) | list }}"
      loop_control:
        loop_var: rep
      block:
        - name: Write vars file for this repetition (so fault_events passes safely)
          copy:
            dest: /tmp/run_vars.yml
            content: |
              run_id: {{ rep }}
              run_label: "{{ run_label }}"
              benchbase_output_dir: "{{ benchbase_output_dir }}"
              fault_events:
              {{ fs.fault_events | to_nice_yaml(indent=2) }}

        - name: Run one repetition
          shell: >
            ansible-playbook -i /home/benchbase/ansible/ansible6/inventory_monitor.yml
            /home/benchbase/ansible/ansible6/run_one_iteration.yml
            --extra-vars "@/tmp/run_vars.yml"
          register: rep_result
          ignore_errors: yes

        - name: Show repetition output (only if success)
          debug:
            msg: "{{ rep_result.stdout_lines | default([]) }}"
          when: rep_result.rc is defined and rep_result.rc == 0

        - name: Show repetition errors (only if failed)
          debug:
            msg: "{{ rep_result.stderr_lines | default([]) }}"
          when: rep_result.rc is defined and rep_result.rc != 0

    - name: Extract summaries for this scenario into its folder
      shell: |
        ./measurements/data/extract_summary_priorities.sh target/benchbase-postgres/results "{{ run_label }}"
      args:
        chdir: /home/benchbase

    - name: Archive measured summaries for this scenario
      shell: |
        mkdir -p "{{ benchbase_output_dir }}/measured_summaries"
        mv /home/benchbase/target/benchbase-postgres/results/*.summary.json "{{ benchbase_output_dir }}/measured_summaries/" 2>/dev/null || true
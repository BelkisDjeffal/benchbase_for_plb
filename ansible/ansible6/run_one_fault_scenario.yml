# File: run_one_fault_scenario.yml

- name: Set run label
  set_fact:
    run_label: "T{{ terminals }}__W{{ weights | replace(',', '-') }}__{{ fs.name }}__{{ ts_run }}"

- name: Set output folder
  set_fact:
    benchbase_output_dir:  "{{ persistent_results_root }}/{{ run_label }}"

- name: Save output path to file (optional)
  copy:
    dest: /tmp/last_benchbase_output_dir.txt
    content: "{{ benchbase_output_dir }}"

- name: Create output folder on NFS
  become: true
  become_user: bdjeffal
  file:
    path: "{{ benchbase_output_dir }}"
    state: directory

# - name: Create output folder
#   file:
#     path: "{{ benchbase_output_dir }}"
#     state: directory

- name: Ensure results directory exists
  file:
    path: "{{ workspace_root }}/target/benchbase-postgres/results"
    state: directory

- name: Clear old measured summaries
  shell: rm -f {{ workspace_root }}/target/benchbase-postgres/results/*.summary.json
  ignore_errors: yes

- name: Run repetitions for this fault scenario
  include_tasks: run_one_rep.yml
  loop: "{{ range(1, repetitions + 1) | list }}"
  loop_control:
    loop_var: rep

- name: Extract summaries for this scenario into its folder
  shell: |
    ./measurements/data/extract_summary_priorities.sh target/benchbase-postgres/results "{{ run_label }}"
  args:
    chdir: /root/benchbase
# File: playbook_injector_monitor.yml

- name: Run BenchBase experiments
  hosts: localhost
  connection: local
  vars:
    benchbase_runs:
      - { terminals: 500, weights: "100,400" }
      - { terminals: 500, weights: "250,250" }
      - { terminals: 500, weights: "400,100" }

    repetitions: 3

    fault_scenarios:
      - name: "no_fault"
        fault_events: []

      - name: "killP_60"
        fault_events:
          - { at_s: 60, role: "premium_replica1", action: "stop" }

      - name: "killF_60"
        fault_events:
          - { at_s: 60, role: "freemium_replica1", action: "stop" }

      - name: "killP_60_killP_90"
        fault_events:
          - { at_s: 60, role: "premium_replica1", action: "stop" }
          - { at_s: 90, role: "premium_replica2", action: "stop" }

      - name: "killF_60_killF_90"
        fault_events:
          - { at_s: 60, role: "freemium_replica1", action: "stop" }
          - { at_s: 90, role: "freemium_replica2", action: "stop" }

      - name: "killP_60_killF_90"
        fault_events:
          - { at_s: 60, role: "premium_replica1", action: "stop" }
          - { at_s: 90, role: "freemium_replica1", action: "stop" }

  tasks:
    - name: Ensure summary extractor is executable
      shell: chmod +x extract_summary_priorities.sh
      args:
        chdir: /home/benchbase/measurements/data

    - name: Run each BenchBase configuration
      loop: "{{ benchbase_runs }}"
      loop_control:
        loop_var: run
      include_tasks: run_benchbase_once_injector_monitor.yml
      vars:
        terminals: "{{ run.terminals }}"
        weights: "{{ run.weights }}"
        repetitions: "{{ repetitions }}"
        fault_scenarios: "{{ fault_scenarios }}"

    # - name: Read last run path
    #   shell: cat /tmp/last_benchbase_output_dir.txt
    #   register: last_output

    # - name: Extract summary priorities into correct folder
    #   shell: |
    #     ./measurements/data/extract_summary_priorities.sh target/benchbase-postgres/results {{ last_output.stdout | regex_replace('.*/monitoring/', '') }}

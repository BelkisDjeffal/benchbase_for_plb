#playbook_injector_monitor.yml
- name: Run BenchBase experiments
  hosts: localhost
  connection: local
  vars:
    benchbase_runs:


      - { terminals: 30, weights: "10,20" }
      - { terminals: 30, weights: "15,15" }
      - { terminals: 30, weights: "20,10" }

      - { terminals: 40, weights: "10,30" }
      - { terminals: 40, weights: "20,20" }
      - { terminals: 40, weights: "30,10" }

      - { terminals: 50, weights: "10,40" }
      - { terminals: 50, weights: "40,10" }
      - { terminals: 50, weights: "25,25" }

      - { terminals: 100, weights: "30,70" }
      - { terminals: 100, weights: "50,50" }
      - { terminals: 100, weights: "70,30" }

      - { terminals: 150, weights: "75,75" }
      - { terminals: 150, weights: "100,50" }
      - { terminals: 150, weights: "50,100" }

      - { terminals: 200, weights: "100,100" }
      - { terminals: 200, weights: "150,50" }
      - { terminals: 200, weights: "50,150" }

      - { terminals: 250, weights: "125,125" }
      - { terminals: 250, weights: "75,175" }
      - { terminals: 250, weights: "175,75" }

      - { terminals: 300, weights: "225,75" }
      - { terminals: 300, weights: "150,150" }
      - { terminals: 300, weights: "225,75" }

      - { terminals: 350, weights: "275,75" }
      - { terminals: 350, weights: "175,175" }
      - { terminals: 350, weights: "75,275" }

      - { terminals: 400, weights: "120,280" }
      - { terminals: 400, weights: "200,200" }
      - { terminals: 400, weights: "280,120" }

      - { terminals: 450, weights: "100,350" }
      - { terminals: 450, weights: "225,225" }
      - { terminals: 450, weights: "350,100" }

      - { terminals: 500, weights: "100,400" }
      - { terminals: 500, weights: "250,250" }
      - { terminals: 500, weights: "400,100" }

      - { terminals: 550, weights: "125,425" }
      - { terminals: 550, weights: "275,275" }
      - { terminals: 550, weights: "425,125" }

      - { terminals: 600, weights: "150,450" }
      - { terminals: 600, weights: "180,420" }
      - { terminals: 600, weights: "450,150" }

      - { terminals: 700, weights: "200,500" }
      - { terminals: 700, weights: "350,350" }
      - { terminals: 700, weights: "500,200" }

      - { terminals: 800, weights: "200,600" }
      - { terminals: 800, weights: "400,400" }
      - { terminals: 800, weights: "600,200" }

      - { terminals: 1000, weights: "200,800" }
      - { terminals: 1000, weights: "500,500" }
      - { terminals: 1000, weights: "800,200" }

      - { terminals: 1500, weights: "400,1100" }
      - { terminals: 1500, weights: "750,750" }
      - { terminals: 1500, weights: "1100,400" }

      - { terminals: 2000, weights: "500,1500" }
      - { terminals: 2000, weights: "1000,1000" }
      - { terminals: 2000, weights: "1500,500" }

      - { terminals: 2500, weights: "600,1900" }
      - { terminals: 2500, weights: "1250,1250" }
      - { terminals: 2500, weights: "1900,600" }

  
  tasks:
    - name: Ensure summary extractor is executable
      shell: chmod +x extract_summary_priorities.sh
      args:
        chdir: /home/benchbase/measurements/data

    - name: Run each BenchBase configuration
      loop: "{{ benchbase_runs }}"
      loop_control:
        loop_var: run
      include_tasks: run_benchbase_once_injector_monitor.yml
      vars:
        terminals: "{{ run.terminals }}"
        weights: "{{ run.weights }}"
  
    - name: Read last run path
      shell: cat /tmp/last_benchbase_output_dir.txt
      register: last_output

    - name: Extract summary priorities into correct folder
      shell: |
        ./measurements/data/extract_summary_priorities.sh target/benchbase-postgres/results {{ last_output.stdout | regex_replace('.*/monitoring/', '') }}
      args:
        chdir: /home/benchbase







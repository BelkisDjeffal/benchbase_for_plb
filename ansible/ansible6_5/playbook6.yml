- name: Initialize grid 5000
  tags: reservation_task
  hosts: grid5000
  remote_user: bdjeffal
  vars:
    OS_image: ubuntu2204-x64-min
    source_host: "{{ premium_nodes[0] }}"
    source_data_dir: /var/lib/postgresql/14/main
    replica_data_dir: /var/lib/postgresql/14/main
  tasks:
    - name: Reserve 6 nodes from Grid5000
      tags: reserve_nodes
      command: "oarsub -p \"host IN ({{ grid_hosts | join(',') }})\" -l host=6,walltime={{ grid_time }} -r '19:00' -t deploy"
      register: job_output

    - name: Extract job ID
      tags: reserve_nodes
      set_fact:
        job_id: "{{ job_output.stdout | regex_search('OAR_JOB_ID=(\\d+)', '\\1') | first }}"

    - name: Log job ID
      tags: reserve_nodes
      debug:
        msg: "Job ID: {{ job_id }}"

    - name: Wait for reservation validation
      tags: reserve_nodes
      pause:
        minutes: 7

    - name: Get job details
      tags: reserve_nodes
      command: "oarstat -f -j {{ job_id }}"
      register: job_details

    - name: Extract assigned hostnames from job output (normal case)
      when: assigned_hostnames is not defined and job_details is defined
      set_fact:
        reserved_nodes: "{{ (job_details.stdout | regex_search('assigned_hostnames = (.+)', '\\1')) | first | split('+') }}"

    - name: Convert assigned_hostnames to reserved_nodes (manual fallback)
      when: assigned_hostnames is defined
      set_fact:
        reserved_nodes: >-
          {{ assigned_hostnames.split('+') | list }}

    - name: Log reserved nodes
      debug:
        msg: "Reserved nodes: {{ reserved_nodes }}"

    - name: Assign nodes to groups
      set_fact:
        postgres_servers: "{{ reserved_nodes[:5] }}"  
        injector_node: "{{ reserved_nodes[5:] }}" 
        premium_nodes: "{{ reserved_nodes[:2] }}"
        freemium_nodes: "{{ reserved_nodes[2:5] }}"

    - name: Generate inventory_monitor.yml from template
      template:
        src: /home/spirals/phd/experiments/janvier/benchbase/templates/inventory_monitor.yml.j2
        dest: "{{ playbook_dir }}/inventory_monitor.yml"
      delegate_to: localhost
      run_once: true


    - name: Create replica role mapping
      set_fact:
        replica_roles: >-
          {{
            dict(
              premium_nodes
              | map('regex_replace', '\\.nancy\\.grid5000\\.fr$', '')
              | zip(range(1, (premium_nodes | length) + 1)
                    | map('string')
                    | map('regex_replace', '^', 'premium_replica'))
              + freemium_nodes
              | map('regex_replace', '\\.nancy\\.grid5000\\.fr$', '')
              | zip(range(1, (freemium_nodes | length) + 1)
                    | map('string')
                    | map('regex_replace', '^', 'freemium_replica'))
            )
          }}

    - name: Debug Assigned Groups
      debug:
        msg:
          - "Postgres Servers: {{ postgres_servers }}"
          - "Injector Node: {{ injector_node }}"
          - "Premium Nodes: {{ premium_nodes }}"
          - "Freemium Nodes: {{ freemium_nodes }}"
          - "Replica Roles: {{ replica_roles }}"

    - name: Render group_vars/all.yml safely
      tags: render_group_vars
      template:
        src: "./all.yml.j2"
        dest: group_vars/all.yml
      delegate_to: localhost
      run_once: true
      
    - name: Add reserved nodes to inventory
      add_host:
        name: "{{ item }}"
        ansible_host: "{{ item }}"
        groups: postgres_servers
      loop: "{{ reserved_nodes[:5] }}"  
      tags: always

    - name: Add the separate node for Java/Other
      add_host:
        name: "{{ reserved_nodes[5] }}"
        ansible_host: "{{ reserved_nodes[5] }}"
        groups: injector_node
      when: reserved_nodes | length > 5
      tags: always

    - name: Deploy OS on all reserved nodes (Start asynchronously)
      command: "kadeploy3 -m {{ item }} -e {{ OS_image }}"
      loop: "{{ reserved_nodes }}"
      async: 600  
      poll: 0
      register: os_deployment_jobs

    - name: Wait for all OS deployments to complete
      async_status:
        jid: "{{ item.ansible_job_id }}"
      register: os_deployment_results
      until: os_deployment_results.finished
      retries: 60  
      delay: 10
      loop: "{{ os_deployment_jobs.results }}"

    - name: Backup authorized_keys before editing
      tags: ssh_stuff
      delegate_to: "{{ injector_node[0] }}"
      remote_user: root
      copy:
        src: /root/.ssh/authorized_keys
        dest: /root/.ssh/authorized_keys.bak
        remote_src: yes
      ignore_errors: yes

    - name: Add frontend public key to injector authorized_keys
      tags: ssh_stuff
      delegate_to: "{{ injector_node[0] }}"
      remote_user: root
      ansible.builtin.lineinfile:
        path: /root/.ssh/authorized_keys
        create: yes
        line: "{{ lookup('file', '/home/spirals/.ssh/id_rsa.pub') }}"
      tags: add_frontend_key_to_injector

    - name: Generate SSH key on injector node
      tags: ssh_stuff
      delegate_to: "{{ injector_node[0] }}"
      remote_user: root
      shell: ssh-keygen -t rsa -f /root/.ssh/id_rsa -q -N ""
      args:
        creates: /root/.ssh/id_rsa

    - name: Fetch public key from injector
      tags: ssh_stuff
      delegate_to: "{{ injector_node[0] }}"
      remote_user: root
      slurp:
        src: /root/.ssh/id_rsa.pub
      register: injector_pubkey
      run_once: true

    - name: Set injector public key
      tags: ssh_stuff
      set_fact:
        injector_pubkey_decoded: "{{ injector_pubkey['content'] | b64decode }}"
      run_once: true

    - name: Add injector’s SSH public key to replica nodes
      tags: ssh_stuff
      ansible.builtin.lineinfile:
        path: /root/.ssh/authorized_keys
        create: yes
        line: "{{ injector_pubkey_decoded }}"
      delegate_to: "{{ item }}"
      remote_user: root
      with_items: "{{ postgres_servers }}"


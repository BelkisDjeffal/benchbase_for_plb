#playbook_injector_monitor.yml
- name: Run BenchBase experiments
  hosts: localhost
  connection: local
  vars:
    benchbase_runs:

      # 50:50, 20:80, 80:20, 30:70, 70:30, 40:60, 60:40
      - { terminals: 50,  weights: "10,40" }
      - { terminals: 50,  weights: "40,10" }

      - { terminals: 100, weights: "20,80" }
      - { terminals: 100, weights: "80,20" }

      - { terminals: 150, weights: "30,120" }
      - { terminals: 150, weights: "120,30" }

      - { terminals: 200, weights: "40,160" }
      - { terminals: 200, weights: "160,40" }

      - { terminals: 250, weights: "50,200" }
      - { terminals: 250, weights: "200,50" }

      - { terminals: 300, weights: "60,240" }
      - { terminals: 300, weights: "240,60" }

      - { terminals: 350, weights: "70,280" }
      - { terminals: 350, weights: "280,70" }

      - { terminals: 400, weights: "80,320" }
      - { terminals: 400, weights: "320,80" }

      - { terminals: 450, weights: "90,360" }
      - { terminals: 450, weights: "360,90" }

      - { terminals: 500, weights: "100,400" }
      - { terminals: 500, weights: "400,100" }
  
      - { terminals: 550, weights: "110,440" }
      - { terminals: 550, weights: "440,110" }

      - { terminals: 600, weights: "120,480" }
      - { terminals: 600, weights: "480,120" }

      - { terminals: 700, weights: "140,560" }
      - { terminals: 700, weights: "560,140" }

      - { terminals: 800, weights: "160,640" }
      - { terminals: 800, weights: "640,160" }

      - { terminals: 1000, weights: "200,800" }
      - { terminals: 1000, weights: "800,200" }

      - { terminals: 1200, weights: "240,960" }
      - { terminals: 1200, weights: "960,240" }

      - { terminals: 1500, weights: "300,1200" }
      - { terminals: 1500, weights: "1200,300" }

      - { terminals: 1800, weights: "360,1440" }
      - { terminals: 1800, weights: "1440,360" }

      - { terminals: 2000, weights: "400,1600" }
      - { terminals: 2000, weights: "1600,400" }

  tasks:
    - name: Ensure summary extractor is executable
      shell: chmod +x extract_summary_priorities.sh
      args:
        chdir: /home/benchbase/measurements/data

    - name: Run each BenchBase configuration
      loop: "{{ benchbase_runs }}"
      loop_control:
        loop_var: run
      include_tasks: run_benchbase_once_injector_monitor.yml
      vars:
        terminals: "{{ run.terminals }}"
        weights: "{{ run.weights }}"
  
    - name: Read last run path
      shell: cat /tmp/last_benchbase_output_dir.txt
      register: last_output

    - name: Extract summary priorities into correct folder
      shell: |
        ./measurements/data/extract_summary_priorities.sh target/benchbase-postgres/results {{ last_output.stdout | regex_replace('.*/monitoring/', '') }}
      args:
        chdir: /home/benchbase

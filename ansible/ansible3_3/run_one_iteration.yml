# File: run_one_iteration.yml
- name: Start monitoring
  hosts: postgres_servers
  become: yes
  tasks:
    - name: Create monitoring folder
      file:
        path: "/tmp/monitoring/{{ run_label }}/run_{{ run_id }}"
        state: directory

    - name: Start pidstat
      shell: |
        nohup pidstat -h -r -u -d 1 > /tmp/monitoring/{{ run_label }}/run_{{ run_id }}/pidstat.log 2>&1 &
        echo $! > /tmp/monitoring/{{ run_label }}/run_{{ run_id }}/pidstat.pid        
      args:
        executable: /bin/bash

- name: Run BenchBase workload
  hosts: localhost
  tasks:

    - name: Record run start time (epoch seconds)
      shell: date +%s
      register: run_start_epoch
      changed_when: false

    - name: Run BenchBase workload (run {{ run_id }})
      shell: >
        java -jar benchbase.jar -b tpch -c config/postgres/sample_tpch_config.xml
        --create=false --load=false --execute=true
        > {{ benchbase_output_dir }}/run_output_{{ run_id }}.txt 2>&1
      args:
        chdir: /root/benchbase/target/benchbase-postgres

    - name: Find bb_ts files created during this run (results dir)
      find:
        paths: "/root/benchbase/target/benchbase-postgres/results"
        patterns: "tpch_*.bb_ts.csv"
        file_type: file
      register: bbts_results

    - name: Find bb_ts files created during this run (work dir)
      find:
        paths: "/root/benchbase/target/benchbase-postgres"
        patterns: "tpch_*.bb_ts.csv"
        file_type: file
      register: bbts_workdir

    - name: Pick newest bb_ts file created after run start
      set_fact:
        bbts_latest: >-
          {{
            (
              (bbts_results.files + bbts_workdir.files)
              | selectattr('mtime', '>=', (run_start_epoch.stdout | int))
              | sort(attribute='mtime')
              | list
            ) | last | default({})
          }}

    - name: Move bb_ts file into run output folder (rename with run id)
      shell: >
        mv "{{ bbts_latest.path }}"
        "{{ benchbase_output_dir }}/tpch_run_{{ run_id }}.bb_ts.csv"
      when: bbts_latest.path is defined

    - name: Find latency_ts files created during this run (results dir)
      find:
        paths: "/root/benchbase/target/benchbase-postgres/results"
        patterns: "tpch_*.latency_ts.csv"
        file_type: file
      register: latencyts_results

    - name: Find latency_ts files created during this run (work dir)
      find:
        paths: "/root/benchbase/target/benchbase-postgres"
        patterns: "tpch_*.latency_ts.csv"
        file_type: file
      register: latencyts_workdir

    - name: Pick newest latency_ts file created after run start
      set_fact:
        latencyts_latest: >-
          {{
            (
              (latencyts_results.files + latencyts_workdir.files)
              | selectattr('mtime', '>=', (run_start_epoch.stdout | int))
              | sort(attribute='mtime')
              | list
            ) | last | default({})
          }}

    - name: Move latency_ts file into run output folder (rename with run id)
      shell: >
        mv "{{ latencyts_latest.path }}"
        "{{ benchbase_output_dir }}/tpch_run_{{ run_id }}.latency_ts.csv"
      when: latencyts_latest.path is defined

- name: Stop monitoring
  hosts: postgres_servers
  become: yes
  tasks:
    - name: Stop pidstat
      shell: "kill -TERM $(cat /tmp/monitoring/{{ run_label }}/run_{{ run_id }}/pidstat.pid)"
      ignore_errors: yes

- name: Fetch monitoring logs
  hosts: postgres_servers
  become: yes
  vars_files:
    - group_vars/all.yml
  tasks:
    - name: Fetch pidstat logs
      fetch:
        src: "/tmp/monitoring/{{ run_label }}/run_{{ run_id }}/pidstat.log"
        dest: "{{ benchbase_output_dir }}/monitoring/run_{{ run_id }}/{{ replica_roles[inventory_hostname] }}_{{ inventory_hostname }}.log"
        flat: yes

- name: Inter-run pause
  hosts: localhost
  tasks:
    - name: Pause before next run
      pause:
        seconds: 10
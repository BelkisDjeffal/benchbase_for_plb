# File: playbook_injector_monitor.yml

- name: Run BenchBase experiments
  hosts: localhost
  connection: local
  vars:
    persistent_results_root: "/home/bdjeffal/measurements/V1_600_4"
    workspace_root: "/root/benchbase"
   
    benchbase_runs:

      - { terminals: 600, weights: "150,450" }
      
    repetitions: 5

    fault_scenarios:
      - name: "killP_90_killP_150_rejoinP1_210_rejoinP2_270"
        fault_events:
          - { at_s: 90, role: "premium_replica1", action: "stop" }
          - { at_s: 150, role: "premium_replica2", action: "stop" }
          - { at_s: 210, role: "premium_replica1", action: "start" }
          - { at_s: 270, role: "premium_replica2", action: "start" }

      - name: "killM_90_killM_150_rejoinM1_210_rejoinM2_270"
        fault_events:
          - { at_s: 90, role: "freemium_replica2", action: "stop" }
          - { at_s: 150, role: "freemium_replica3", action: "stop" }
          - { at_s: 210, role: "freemium_replica2", action: "start" }
          - { at_s: 270, role: "freemium_replica3", action: "start" }
          
      # -----------------------------
      # Cross-pool logical faults
      # -----------------------------
      - name: "killP_90_killF_150_rejoinP_210_rejoinF_270"
        fault_events:
          - { at_s: 90, role: "premium_replica1", action: "stop" }
          - { at_s: 150, role: "freemium_replica1", action: "stop" }
          - { at_s: 210, role: "premium_replica1", action: "start" }
          - { at_s: 270, role: "freemium_replica1", action: "start" }

      - name: "killF_90_killM_150_rejoinF_210_rejoinM_270"
        fault_events:
          - { at_s: 90, role: "freemium_replica1", action: "stop" }
          - { at_s: 150, role: "freemium_replica2", action: "stop" }
          - { at_s: 210, role: "freemium_replica1", action: "start" }
          - { at_s: 270, role: "freemium_replica2", action: "start" }


  tasks:
    - name: Ensure summary extractor is executable
      shell: chmod +x extract_summary_priorities.sh
      args:
        chdir: /root/benchbase/measurements/data

    - name: Run each BenchBase configuration
      loop: "{{ benchbase_runs }}"
      loop_control:
        loop_var: run
      include_tasks: run_benchbase_once_injector_monitor.yml
      vars:
        terminals: "{{ run.terminals }}"
        weights: "{{ run.weights }}"
        # repetitions: "{{ repetitions }}"


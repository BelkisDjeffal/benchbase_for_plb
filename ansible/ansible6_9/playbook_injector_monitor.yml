  hosts: localhost
  connection: local
  vars:
    benchbase_runs:

      # 50:50, 20:80, 80:20, 30:70, 70:30, 40:60, 60:40
      
      - { terminals: 450, weights: "270,180" }

      - { terminals: 500, weights: "250,250" }

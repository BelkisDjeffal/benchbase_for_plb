      - { terminals: 500, weights: "400,100" }
      - { terminals: 500, weights: "150,350" }
      - { terminals: 500, weights: "350,150" }
      - { terminals: 500, weights: "200,300" }
      - { terminals: 500, weights: "300,200" }

      - { terminals: 550, weights: "275,275" }
      - { terminals: 550, weights: "110,440" }
      - { terminals: 550, weights: "440,110" }
      - { terminals: 550, weights: "165,385" }
      - { terminals: 550, weights: "385,165" }
      - { terminals: 550, weights: "220,330" }
      - { terminals: 550, weights: "330,220" }

      - { terminals: 600, weights: "300,300" }
      - { terminals: 600, weights: "120,480" }
      - { terminals: 600, weights: "480,120" }
